    <!-- FAQPage Schema for Google Rich Snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Are my PDF documents and uploaded photos safe & private?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, 100%! FreePDF Tools processes all files entirely inside your browser memory using WebAssembly and client-side JavaScript. Your files never leave your device or touch an external server."

          "@type": "Question",
          "name": "How do I convert a PDF to Word (.docx) without losing tables and formatting?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Select the 'PDF to Other' tab, drag & drop your PDF, and select DOCX as the target format. Our intelligent parser reconstructs document paragraphs, table borders, headings, and lists into genuine native Microsoft Word formatting."
          }
        },
        {
          "@type": "Question",
          "name": "How can I compress an exam photo or passport image to exactly 50 KB or 20 KB?",
          "acceptedAnswer": {
            "@type": "Answer",

          }
        },
        {
          "@type": "Question",
          "name": "Can I extract text from scanned PDFs, invoices, and photo receipts?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes! Navigate to the 'OCR & Text' tab, upload your scanned PDF or photo, pick the document language, and click 'Start OCR'. You can copy recognized text with 1 click or export it directly as an editable Word (.docx) document."
          }
